plugins { id 'com.android.application' }
def releaseInfo = new groovy.json.JsonSlurper().parse(file('../../../package.json'))
def parts = releaseInfo.version.tokenize('.').collect { it as int }
android {
    namespace 'app.tiemviopos.template'
    compileSdk 36
    defaultConfig {
        applicationId 'app.tiemviopos.template'
        minSdk 24
        targetSdk 36
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName releaseInfo.version
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: '../release.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'androidx.work:work-runtime:2.10.1'
}
